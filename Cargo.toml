[package]
name = "waveshare-epd397-rust-app"
version = "1.5.0-beta.4"
authors = ["Piyush Daiya"]
edition = "2021"
resolver = "2"
rust-version = "1.82"
description = "Rustmix Wave e-reader and audiobook firmware for the Waveshare ESP32-S3 e-Paper 3.97 board: TXT and EPUB reader with covers, bookmarks and dictionary lookup, MP3 audiobooks, reading statistics, Wi-Fi SD transfer portal, microSD as a USB disk, and PMIC standby"
license = "MIT"

[[bin]]
name = "waveshare-epd397-rust-app"
harness = false

[profile.dev]
debug = true
opt-level = "z"

[profile.release]
codegen-units = 1
# "thin" instead of full/"fat" LTO: fat LTO's cross-crate merging under
# codegen-units=1 hits an Xtensa LLVM backend instruction-selection crash
# ("Cannot select: i32 = Constant<-32768>") inside
# `reader::paginate_epub_chapter_up_to` in this profile. Confirmed by
# bisection: the pre-existing committed baseline builds fine with fat LTO,
# and disabling LTO entirely also avoids the crash, so it is a backend
# limitation exposed by this profile's code shape, not a Rust-level bug.
# Thin LTO keeps most of fat LTO's cross-crate size/perf benefit while
# avoiding this crash.
lto = "thin"
opt-level = "s"
strip = true

# The firmware as a whole optimizes for size, but these decoders are pure
# compute on large buffers (EPUB DEFLATE on every uncached open, PNG and
# fallback JPEG decode for covers and inline images), where -O3 is worth its
# modest size cost. The image uses under 3 MB of each 5 MB OTA slot.
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.fdeflate]
opt-level = 3
[profile.release.package.png]
opt-level = 3
[profile.release.package.jpeg-decoder]
opt-level = 3

[dependencies]
anyhow = "1"
embedded-graphics = "0.8.1"
embedded-hal = "1.0"
embedded-iconoir = { version = "0.2.3", features = ["96px", "48px", "24px"] }
log = "0.4"
miniz_oxide = "0.8"
# EPUB cover thumbnails: JPEG uses native scaled decoding (1/8..1) so covers
# are decoded near the target thumbnail size instead of at full resolution.
# `default-features = false` drops the optional `rayon` thread pool, which
# this single-threaded firmware main loop has no use for.
jpeg-decoder = { version = "0.3", default-features = false }
# PNG has no native scaled decoding: images are read row by row and reduced
# while read (cover_cache::decode_png_reduced). Chosen over the `image`
# crate (already a dev-dependency for host PNG test export) to avoid pulling
# its multi-format decoder abstraction into the firmware target; this reuses
# `miniz_oxide`, already a direct dependency for EPUB's DEFLATE.
png = "0.17"
# Wi-Fi provisioning portal: renders the AP-join and portal-URL QR codes on
# the e-paper screen. `default-features = false` drops the optional `image`
# rendering backend; only the raw module grid (`QrCode::to_colors`) is used.
qrcode = { version = "0.14", default-features = false }

[target.'cfg(target_os = "espidf")'.dependencies]
embedded-svc = "0.29"
esp-idf-svc = "0.52.1"
es8311 = "0.1.0"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

# Host-only: renders FrameBuffer screens to PNG for UI review without hardware.
# See app::mod::tests::export_screen_previews (run with `cargo test -- --ignored`).
[dev-dependencies]
image = { version = "0.24", default-features = false, features = ["png"] }

[package.metadata.esp-idf-sys]
esp_idf_version = "v5.5.1"
esp_idf_tools_install_dir = "global"

# SIMD-accelerated baseline JPEG decoder from Espressif, used for EPUB inline
# images and cover thumbnails (see `cover_cache::decode_jpeg_scaled`), with
# `jpeg-decoder` kept as the fallback for progressive JPEGs it rejects.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_new_jpeg", version = "1.0.2" }
bindings_header = "bindings/esp_new_jpeg.h"
bindings_module = "esp_new_jpeg"

# Helix fixed-point MP3 decoder (RealNetworks RPSL/RCSL), packaged for
# ESP-IDF: the decoder the Waveshare audio examples for this board use.
# Audiobook playback, see `audio::mp3`.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "chmorgan/esp-libhelix-mp3", version = "1.0.3" }
bindings_header = "bindings/libhelix_mp3.h"
bindings_module = "libhelix_mp3"

# The microSD as a USB disk for a PC ("Connect to PC"): a small local C
# component over Espressif's TinyUSB stack, whose USB descriptors are C
# macros. See components/usbdisk/include/usbdisk.h.
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/usbdisk"]
bindings_header = "components/usbdisk/include/usbdisk.h"
bindings_module = "usbdisk"
